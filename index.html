<body>

  <script>
    function normalizeFragmentUrl(url) {
      const [path, query = ''] = url.split('?');
      if (/^(https?:)?\/\//.test(path) || /\.[a-z0-9]+$/i.test(path)) {
        return url;
      }
      return `${path}.html${query ? `?${query}` : ''}`;
    }

    // 로딩 오버레이 제어 함수
    function showLoading() {
      const loadingElem = document.getElementById('loading');
      if (loadingElem) {
        loadingElem.classList.remove('hidden');
      }
    }
    function hideLoading() {
      const loadingElem = document.getElementById('loading');
      if (loadingElem) {
        loadingElem.classList.add('hidden');
      }
    }

    function formatCvStatements(root) {
      root.querySelectorAll('.intro').forEach((intro) => {
        intro.querySelectorAll('.statement').forEach((statement) => {
          if (statement.dataset.cvFormatted === 'true') return;

          const includePath = statement.dataset.includeHtml || '';
          const isCvInclude = includePath.includes('cv_');
          if (!isCvInclude) return;

          const lines = statement.innerText
            .split('\n')
            .map(line => line.replace(/\r/g, '').trim())
            .filter(line => line.length > 0);

          const fragment = document.createDocumentFragment();
          const yearPattern = /^(\d{4})\s+(.+)$/;
          const isEnglishStatement = lines.some(line => line.startsWith('ㅇEducation'));

          function appendTitleStyledText(target, text) {
            if (!isEnglishStatement) {
              target.textContent = text;
              return;
            }

            const parts = text.split(/(《[^》]+》)/g).filter(Boolean);
            if (parts.length === 0) {
              target.textContent = text;
              return;
            }

            parts.forEach((part) => {
              const match = part.match(/^《([^》]+)》$/);
              if (match) {
                const title = document.createElement('span');
                title.className = 'cv-title';
                title.textContent = match[1];
                target.appendChild(title);
              } else {
                target.appendChild(document.createTextNode(part));
              }
            });
          }

          lines.forEach((line) => {
            const yearMatch = line.match(yearPattern);

            if (line.startsWith('ㅇ')) {
              const heading = document.createElement('div');
              heading.className = 'cv-heading';
              if (isEnglishStatement && line === 'ㅇSolo and Two-Person Exhibitions') {
                heading.classList.add('cv-heading-solo');
              }
              heading.textContent = line;
              fragment.appendChild(heading);
              return;
            }

            if (yearMatch) {
              const entry = document.createElement('div');
              entry.className = 'cv-entry';

              const year = document.createElement('div');
              year.className = 'cv-year';
              year.textContent = yearMatch[1];

              const body = document.createElement('div');
              body.className = 'cv-body';
              appendTitleStyledText(body, yearMatch[2]);

              entry.appendChild(year);
              entry.appendChild(body);
              fragment.appendChild(entry);
              return;
            }

            const subheading = document.createElement('div');
            subheading.className = 'cv-subheading';
            subheading.textContent = line;
            fragment.appendChild(subheading);
          });

          statement.textContent = '';
          statement.appendChild(fragment);
          statement.dataset.cvFormatted = 'true';
        });
      });
    }

    async function resolveIncludes(root) {
      const includeNodes = Array.from(root.querySelectorAll('[data-include-html]'));
      await Promise.all(includeNodes.map(async (node) => {
        if (node.dataset.includeResolved === 'true') return;

        const response = await fetch(normalizeFragmentUrl(node.dataset.includeHtml));
        if (!response.ok) {
          throw new Error(`Failed to load include from ${node.dataset.includeHtml}`);
        }

        node.innerHTML = await response.text();
        node.dataset.includeResolved = 'true';
      }));
    }
    
    // 스크롤 트리거 일시 비활성화 관련 변수 및 함수
    let scrollTriggerDisabled = false;
    function disableScrollTriggerFor(duration) {
      scrollTriggerDisabled = true;
      setTimeout(() => {
        scrollTriggerDisabled = false;
      }, duration);
    }
    
    // HTML 콘텐츠를 가져와 컨테이너에 삽입하는 함수  
    // 이미지 관련 특별한 처리 없이 그대로 삽입합니다.
    function loadContent(url, targetSide) {
      const container = document.querySelector(`.${targetSide}`);
      if (!container) {
        console.error(`Container with class ${targetSide} not found.`);
        return Promise.reject(new Error(`Container with class ${targetSide} not found.`));
      }
      
      return fetch(normalizeFragmentUrl(url))
        .then(response => {
          if (!response.ok) {
            throw new Error(`Failed to load content from ${url}`);
          }
          return response.text();
        })
        .then(data => {
          container.innerHTML = data;
          return resolveIncludes(container).then(() => {
            formatCvStatements(container);
            container.scrollTop = 0;
            container.classList.remove('fade-in');

            // 컨테이너에 페이드인 효과 적용
            void container.offsetWidth; // reflow 강제
            container.classList.add('fade-in');

            // 바로 로딩 오버레이 숨김 처리
            hideLoading();
          });
        })
        .catch(error => {
          container.innerHTML = `<p style="color: red;">Error loading content: ${error.message}</p>`;
          console.error(error);
        });
    }
    
    // contentShowSection 함수 (클릭 시 호출)
    async function contentShowSection(urlLeft, urlRight) {
      // 클릭 후 1초 동안 스크롤 트리거가 적용되지 않도록 함
      disableScrollTriggerFor(1000);
      try {
        showLoading();
        if (urlRight) {
          await loadContent(urlRight, 'right');
          if (urlLeft) {
            await loadContent(urlLeft, 'left');
          }
        } else if (urlLeft) {
          await loadContent(urlLeft, 'left');
        }
      } catch (error) {
        console.error('Error in contentShowSection:', error);
      }
    }
    
    // Observer 관련 기능
    let observer;
    const observedElements = new Set();
    let lastObservedContentUrl = '';
    function initializeObserver() {
      if (!observer) {
        const observerRoot = document.querySelector('.right');
        observer = new IntersectionObserver((entries) => {
          const visibleEntries = entries
            .filter(entry => entry.isIntersecting)
            .sort((a, b) => b.intersectionRatio - a.intersectionRatio);

          visibleEntries.forEach(entry => {
            if (scrollTriggerDisabled) return;

            const contentUrl = entry.target.getAttribute('data-content-url');
            const targetSide = entry.target.getAttribute('data-side');
            if (!contentUrl || contentUrl === lastObservedContentUrl) return;

            lastObservedContentUrl = contentUrl;
            loadContent(contentUrl, targetSide);
          });
        }, {
          root: observerRoot,
          rootMargin: '-35% 0px -35% 0px',
          threshold: [0.2, 0.35, 0.5, 0.7]
        });
      }
    }
    function observeNewContent() {
      document.querySelectorAll('.scroll-trigger').forEach(element => {
        if (!observedElements.has(element)) {
          observer.observe(element);
          observedElements.add(element);
        }
      });
    }
    function enableDynamicObservation() {
      const targetNode = document.body;
      const config = { childList: true, subtree: true };
      const mutationObserver = new MutationObserver(() => {
        requestAnimationFrame(() => observeNewContent());
      });
      mutationObserver.observe(targetNode, config);
    }
    
    // 랜덤 텍스트 기능 (필요 시)
    function runRandomText() {
      const elements = document.getElementsByClassName('back');
      for (let i = 0; i < elements.length; i++) {
        setInterval(function(element) {
          randomizeText(element);
        }, 600, elements[i]);
      }
    }
    function randomizeText(element) {
      const originalText = element.innerText;
      const randomIndex = Math.floor(Math.random() * originalText.length);
      const randomChar = String.fromCharCode(Math.floor(Math.random() * 26) + 97);
      const newText = originalText.substring(0, randomIndex) + randomChar + originalText.substring(randomIndex + 1);
      element.innerText = newText;
    }
    
    // 초기 콘텐츠 로드 (예시)
    window.addEventListener('load', async () => {
      await loadContent('../part/intro', 'right');
      await loadContent('../part/blank', 'left');
      
      initializeObserver();
      observeNewContent();
      enableDynamicObservation();
      
      runRandomText();
    });

    function showSection(sectionId, targetSide) {
    const filePath = `../part/${sectionId}`;  // 동적 파일 경로
    loadContent(filePath, targetSide);        // 동적 콘텐츠 로드
}
